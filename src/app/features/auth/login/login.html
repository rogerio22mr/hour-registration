<main class="relative min-h-screen flex items-center justify-center bg-gradient-to-b from-gray-50 to-gray-100 dark:from-gray-950 dark:to-gray-900 px-4 transition-colors">
  <button
    type="button"
    class="absolute top-4 right-4 rounded-lg p-2 text-gray-400 hover:text-gray-700 hover:bg-gray-100 dark:hover:text-gray-200 dark:hover:bg-gray-800 transition focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600"
    (click)="toggleTheme()"
    [attr.aria-label]="isDark() ? t('common.switchToLight') : t('common.switchToDark')"
    [matTooltip]="isDark() ? t('common.switchToLight') : t('common.switchToDark')"
    [attr.aria-pressed]="isDark()"
  >
    @if (isDark()) {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    }
  </button>

  <div class="w-full max-w-sm">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-sm dark:shadow-lg border border-gray-200 dark:border-gray-700 p-8 transition-colors">
      <div class="mb-8 text-center">
        <h1 class="text-2xl font-semibold text-gray-900 dark:text-gray-50">{{ t('login.signIn') }}</h1>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ t('login.subtitle') }}</p>
      </div>

      <form
        [formGroup]="form"
        (ngSubmit)="onSubmit()"
        novalidate
        [attr.aria-label]="t('login.formAria')"
      >
        <div class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
              {{ t('login.email') }}
            </label>
            <input
              id="email"
              type="email"
              formControlName="email"
              autocomplete="email"
              class="w-full rounded-lg border px-3 py-2 text-sm outline-none transition focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 [color-scheme:light] dark:[color-scheme:dark]"
              [class.border-red-500]="emailInvalid()"
              [class.border-gray-300]="!emailInvalid()"
              [class.dark:border-gray-600]="!emailInvalid()"
              [attr.aria-invalid]="emailInvalid()"
              aria-describedby="email-error"
              placeholder="you@example.com"
            />
            @if (emailInvalid()) {
              <p id="email-error" class="mt-1 text-xs text-red-600" role="alert">
                {{ t('login.emailError') }}
              </p>
            }
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">
              {{ t('login.password') }}
            </label>
            <input
              id="password"
              type="password"
              formControlName="password"
              autocomplete="current-password"
              class="w-full rounded-lg border px-3 py-2 text-sm outline-none transition focus:ring-2 focus:ring-blue-500 focus:border-transparent bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder:text-gray-400 dark:placeholder:text-gray-500 [color-scheme:light] dark:[color-scheme:dark]"
              [class.border-red-500]="passwordInvalid()"
              [class.border-gray-300]="!passwordInvalid()"
              [class.dark:border-gray-600]="!passwordInvalid()"
              [attr.aria-invalid]="passwordInvalid()"
              aria-describedby="password-error"
              placeholder="••••••••"
            />
            @if (passwordInvalid()) {
              <p id="password-error" class="mt-1 text-xs text-red-600" role="alert">
                {{ t('login.passwordError') }}
              </p>
            }
          </div>
        </div>

        @if (errorMessage()) {
          <div
            class="mt-4 rounded-lg bg-red-50 dark:bg-red-950/40 border border-red-200 dark:border-red-900 px-4 py-3 text-sm text-red-700 dark:text-red-300"
            role="alert"
            aria-live="assertive"
          >
            {{ errorMessage() }}
          </div>
        }

        <button
          type="submit"
          class="mt-6 w-full rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-600 disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="loading()"
          [attr.aria-busy]="loading()"
        >
          @if (loading()) {
            <span class="inline-flex items-center gap-2">
              <svg
                class="animate-spin h-4 w-4"
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
              </svg>
              {{ t('login.signingIn') }}
            </span>
          } @else {
            {{ t('login.signIn') }}
          }
        </button>
      </form>
    </div>
  </div>
</main>
